services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nlti
      POSTGRES_USER: nlti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: on-failure:5
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nlti:${POSTGRES_PASSWORD}@db:5432/nlti
      NLTI_ENV: development
      NLTI_DOCUMENT_STORE: /var/lib/nlti/documents
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - document_data:/var/lib/nlti/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_NLTI_API_URL: ${NEXT_PUBLIC_NLTI_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_NLTI_API_URL: ${NEXT_PUBLIC_NLTI_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  document_data:
